name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend
        
      - name: Run tests
        run: pytest
        working-directory: backend

      - name: Start backend server
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        working-directory: backend

      - name: Wait for backend to be ready
        run: |
          for i in {1..10}; do
            curl -s http://localhost:8000/health && break
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman (Health + Users)
        run: newman run postman/QA_Practice_Hub.postman_collection.json -e postman/QA_Practice_Hub.postman_environment.json --folder Health --folder Users